monolog:
    channels: ['deprecation', 'rag', 'streaming', 'response_basic', 'response_assistant']

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            # uncomment to get logging in your browser
            # you may have to allow bigger header sizes in your Web server configuration
            #firephp:
            #    type: firephp
            #    level: info
            #chromephp:
            #    type: chromephp
            #    level: info
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]
            rag:
                type: stream
                path: "%kernel.logs_dir%/rag.log"
                level: debug
                channels: [ "rag" ]
            streaming:
                type: stream
                path: "%kernel.logs_dir%/streaming.log"
                level: debug
                channels: [ "streaming" ]
            response_basic:
                type: stream
                path: "%kernel.logs_dir%/response_basic.log"
                level: debug
                channels: [ "response_basic" ]
            response_assistant:
                type: stream
                path: "%kernel.logs_dir%/response_assistant.log"
                level: debug
                channels: [ "response_assistant" ]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
            rag:
                type: stream
                path: "%kernel.logs_dir%/rag.log"
                level: debug
                channels: [ "rag" ]
            streaming:
                type: stream
                path: "%kernel.logs_dir%/streaming.log"
                level: debug
                channels: [ "streaming" ]
            response_basic:
                type: stream
                path: "%kernel.logs_dir%/response_basic.log"
                level: debug
                channels: [ "response_basic" ]
            response_assistant:
                type: stream
                path: "%kernel.logs_dir%/response_assistant.log"
                level: debug
                channels: [ "response_assistant" ]

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
            rag:
                type: stream
                path: "%kernel.logs_dir%/rag.log"
                level: info
                channels: [ "rag" ]
            streaming:
                type: stream
                path: "%kernel.logs_dir%/streaming.log"
                level: info
                channels: [ "streaming" ]
            response_basic:
                type: stream
                path: "%kernel.logs_dir%/response_basic.log"
                level: info
                channels: [ "response_basic" ]
            response_assistant:
                type: stream
                path: "%kernel.logs_dir%/response_assistant.log"
                level: info
                channels: [ "response_assistant" ]
